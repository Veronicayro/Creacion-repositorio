name: Create Repository

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: "Nombre del repositorio"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar nombre
        run: |
          echo "Repositorio solicitado: ${{ inputs.repository_name }}"
